<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Pin-Bell Sunset Gradient -->
    <linearGradient id="pinBellGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Drop Shadow for Pin Body -->
    <filter id="elevatedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.2"/>
    </filter>

    <!-- Glow for Target Pulse -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ambient Radar Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#ambientGlow)"/>

  <!-- Radar Geofence Perimeter Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Subtle Crosshairs -->
  <path d="M256,60 L256,90 M256,422 L256,452 M60,256 L90,256 M422,256 L452,256" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- Ground Radar Ripples at Pin Origin -->
  <ellipse cx="256" cy="360" rx="72" ry="14" fill="none" stroke="#818CF8" stroke-width="5" stroke-opacity="0.55"/>
  <ellipse cx="256" cy="360" rx="42" ry="8" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Acoustic Sonar Waves — Outer Arcs (Electric Indigo) -->
  <path d="M156,170 C130,202 130,254 156,286" fill="none" stroke="#6366F1" stroke-width="9" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M356,170 C382,202 382,254 356,286" fill="none" stroke="#6366F1" stroke-width="9" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- Acoustic Sonar Waves — Inner Arcs (Vibrant Light Indigo) -->
  <path d="M180,190 C162,212 162,244 180,266" fill="none" stroke="#818CF8" stroke-width="11" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M332,190 C350,212 350,244 332,266" fill="none" stroke="#818CF8" stroke-width="11" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Pin-Bell Crown Ring -->
  <circle cx="256" cy="130" r="16" fill="none" stroke="#FBBF24" stroke-width="8"/>

  <!-- Main Emblem: Pin-Bell Fusion Body -->
  <g filter="url(#elevatedShadow)">
    <path d="M256,142
             C294,142 318,176 318,218
             C318,242 328,252 332,256
             C314,289 276,327 256,355
             C236,327 198,289 180,256
             C184,252 194,242 194,218
             C194,176 218,142 256,142 Z"
          fill="url(#pinBellGrad)"/>
  </g>

  <!-- Left Shoulder Highlight Ridge for depth -->
  <path d="M208,166 C198,190 198,218 194,236" fill="none" stroke="#FEF3C7" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- Clapper Cavity (Midnight Slate Negative Space) -->
  <circle cx="256" cy="225" r="28" fill="#0F172A"/>

  <!-- GPS Target Pulse Beacon (Pure White Center) -->
  <circle cx="256" cy="225" r="14" fill="#FFFFFF" filter="url(#beaconGlow)"/>
</svg>
